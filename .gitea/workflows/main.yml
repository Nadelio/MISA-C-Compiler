name: Build

on:
  push:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Compile with Clang
        run: |
          clang -Iinclude -Wall \
            src/token.c src/ast.c src/type.c src/symtab.c \
            src/lexer.c src/parser.c src/sema.c src/codegen.c src/main.c \
            -o misacc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: misacc-linux
          path: misacc

  release:
    runs-on: ubuntu-latest
    needs: [ build-linux ]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          echo 'commits<<EOF' >> $GITHUB_OUTPUT
          git log --no-merges --pretty=format:'- %s' ${{ github.event.before }}...${{ github.sha }} >> $GITHUB_OUTPUT
          echo '' >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: misacc-linux
          path: artifacts/linux

      - name: Bundle artifact
        run: |
          mkdir -p bundle/linux
          cp artifacts/linux/misacc bundle/linux/
          chmod +x bundle/linux/misacc
          cp -r "MISA Libraries" bundle/linux/
          cd bundle/linux && zip -r ../../artifacts/misacc-linux.zip . && cd ../..

      - name: Create release and upload assets
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          COMMITS: ${{ steps.changelog.outputs.commits }}
        run: |
          python3 - << 'PYEOF'
          import json, subprocess, os

          server  = os.environ['SERVER_URL']
          repo    = os.environ['REPOSITORY']
          run_no  = os.environ['RUN_NUMBER']
          sha     = os.environ['SHA']
          commits = os.environ['COMMITS']
          token   = os.environ['GITEA_TOKEN']

          doc_link = f"{server}/{repo}/src/branch/main/Mnemonimov%20Manual/Doc%20Comment%20Format.md"

          body = f"""## MISA C Compiler — Build #{run_no}

A C89 compiler that targets the MISA/Mnemonimov VM architecture.

---

## Changelog

{commits}

## Usage

```
misacc <input.c> [-o output.misa] [--doc|-gd] [-isystem <dir>]
```

| Argument | Description |
|---|---|
| `<input.c>` | C89 source file to compile (required) |
| `-o output.misa` | Write output to a file instead of stdout |
| `--doc`/`-gd` | Generate doc comments in output (See: [Doc Comment Format]({doc_link})) |
| `-isystem <dir>` | Override the system include search directory for `<...>` includes |

**Examples:**
```
# Compile and write to a file
misacc program.c -o program.misa

# Compile with a custom standard library
misacc program.c -isystem ~/misacc/include -o program.misa

# Compile and pipe output
misacc program.c > program.misa
```

> On Linux the binary may need to be made executable first:
> ```
> chmod +x misacc-linux
> ```

---

## Compiling from Source

**Requirements:** `clang`

**Using CMake:**

```
mkdir build
cd build
cmake ..
make
```

**Manual:**
```sh
clang -Iinclude -Wall \\
  src/token.c src/ast.c src/type.c src/symtab.c \\
  src/lexer.c src/parser.c src/sema.c src/codegen.c src/main.c \\
  -o misacc
```

---

**Commit:** {sha}"""

          payload = json.dumps({
              "tag_name": f"build-{run_no}",
              "name": f"Build #{run_no}",
              "body": body,
          })

          result = subprocess.run([
              "curl", "-sf", "-X", "POST",
              "-H", f"Authorization: token {token}",
              "-H", "Content-Type: application/json",
              "-d", payload,
              f"{server}/api/v1/repos/{repo}/releases",
          ], capture_output=True, text=True, check=True)

          release_id = json.loads(result.stdout)["id"]

          subprocess.run([
              "curl", "-sf", "-X", "POST",
              "-H", f"Authorization: token {token}",
              "-F", "attachment=@artifacts/misacc-linux.zip",
              f"{server}/api/v1/repos/{repo}/releases/{release_id}/assets",
          ], check=True)
          PYEOF
